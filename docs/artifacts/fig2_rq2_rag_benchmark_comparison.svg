<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;">
  <rect width="900" height="500" fill="#fcfdfc" rx="8"/>
  <text x="40" y="45" font-size="20" font-weight="bold" fill="#1a2521">RQ2: 40题基准集三组检索对照实验与显著性检验</text>
  <text x="40" y="70" font-size="13" fill="#55645d">对照组设计：纯关键词匹配 (TF-IDF) vs 纯向量语义 (ChromaDB) vs 混合重排 (本项目)</text>

  <!-- 图例 -->
  <rect x="530" y="32" width="16" height="16" fill="#84938b" rx="3"/>
  <text x="555" y="45" font-size="12" fill="#1a2521">组A: 纯关键词</text>
  <rect x="655" y="32" width="16" height="16" fill="#2f6fa3" rx="3"/>
  <text x="680" y="45" font-size="12" fill="#1a2521">组B: 纯向量</text>
  <rect x="760" y="32" width="16" height="16" fill="#1e6b4b" rx="3"/>
  <text x="785" y="45" font-size="12" fill="#1a2521">组C: 混合重排</text>

  <!-- 坐标轴 -->
  <line x1="160" y1="100" x2="840" y2="100" stroke="#e2e8e5" stroke-dasharray="4"/>
  <line x1="160" y1="180" x2="840" y2="180" stroke="#e2e8e5" stroke-dasharray="4"/>
  <line x1="160" y1="260" x2="840" y2="260" stroke="#e2e8e5" stroke-dasharray="4"/>
  <line x1="160" y1="340" x2="840" y2="340" stroke="#e2e8e5" stroke-dasharray="4"/>
  <line x1="160" y1="420" x2="840" y2="420" stroke="#1a2521" stroke-width="1.5"/>

  <text x="150" y="105" font-size="12" fill="#55645d" text-anchor="end">100%</text>
  <text x="150" y="180" font-size="12" fill="#55645d" text-anchor="end">75%</text>
  <text x="150" y="260" font-size="12" fill="#55645d" text-anchor="end">50%</text>
  <text x="150" y="340" font-size="12" fill="#55645d" text-anchor="end">25%</text>
  <text x="150" y="425" font-size="12" fill="#55645d" text-anchor="end">0%</text>

  <!-- MRR (倒数排名) 分组柱 -->
  <rect x="190" y="283" width="26" height="137" fill="#84938b" rx="2" opacity="0.85"/>
  <text x="203" y="278" font-size="10" fill="#55645d" text-anchor="middle">42.88%</text>

  <rect x="217" y="345" width="26" height="75" fill="#2f6fa3" rx="2" opacity="0.85"/>
  <text x="230" y="340" font-size="10" fill="#2f6fa3" text-anchor="middle">23.62%</text>

  <rect x="244" y="274" width="26" height="146" fill="#1e6b4b" rx="2" opacity="0.95"/>
  <text x="257" y="269" font-size="11" font-weight="bold" fill="#1e6b4b" text-anchor="middle">45.73%</text>

  <text x="230" y="445" font-size="12" font-weight="600" fill="#1a2521" text-anchor="middle">MRR (倒数排名)</text>

  <!-- Recall@3 分组柱 -->
  <rect x="320" y="260" width="26" height="160" fill="#84938b" rx="2" opacity="0.85"/>
  <text x="333" y="255" font-size="10" fill="#55645d" text-anchor="middle">50.00%</text>

  <rect x="347" y="324" width="26" height="96" fill="#2f6fa3" rx="2" opacity="0.85"/>
  <text x="360" y="319" font-size="10" fill="#2f6fa3" text-anchor="middle">30.00%</text>

  <rect x="374" y="276" width="26" height="144" fill="#1e6b4b" rx="2" opacity="0.95"/>
  <text x="387" y="271" font-size="11" font-weight="bold" fill="#1e6b4b" text-anchor="middle">45.00%</text>

  <text x="360" y="445" font-size="12" font-weight="600" fill="#1a2521" text-anchor="middle">Recall@3</text>

  <!-- Recall@5 分组柱 -->
  <rect x="450" y="212" width="26" height="208" fill="#84938b" rx="2" opacity="0.85"/>
  <text x="463" y="207" font-size="10" fill="#55645d" text-anchor="middle">65.00%</text>

  <rect x="477" y="284" width="26" height="136" fill="#2f6fa3" rx="2" opacity="0.85"/>
  <text x="490" y="279" font-size="10" fill="#2f6fa3" text-anchor="middle">42.50%</text>

  <rect x="504" y="236" width="26" height="184" fill="#1e6b4b" rx="2" opacity="0.95"/>
  <text x="517" y="231" font-size="11" font-weight="bold" fill="#1e6b4b" text-anchor="middle">57.50%</text>

  <text x="490" y="445" font-size="12" font-weight="600" fill="#1a2521" text-anchor="middle">Recall@5</text>

  <!-- Recall@10 分组柱 -->
  <rect x="580" y="188" width="26" height="232" fill="#84938b" rx="2" opacity="0.85"/>
  <text x="593" y="183" font-size="10" fill="#55645d" text-anchor="middle">72.50%</text>

  <rect x="607" y="236" width="26" height="184" fill="#2f6fa3" rx="2" opacity="0.85"/>
  <text x="620" y="231" font-size="10" fill="#2f6fa3" text-anchor="middle">57.50%</text>

  <rect x="634" y="164" width="26" height="256" fill="#1e6b4b" rx="2" opacity="0.95"/>
  <text x="647" y="159" font-size="11" font-weight="bold" fill="#1e6b4b" text-anchor="middle">80.00%</text>

  <text x="620" y="445" font-size="12" font-weight="600" fill="#1a2521" text-anchor="middle">Recall@10</text>

  <!-- 负例检索命中率 分组柱 -->
  <rect x="710" y="260" width="26" height="160" fill="#84938b" rx="2" opacity="0.85"/>
  <text x="723" y="255" font-size="10" fill="#55645d" text-anchor="middle">50.00%</text>

  <rect x="737" y="420" width="26" height="0" fill="#2f6fa3" rx="2" opacity="0.85"/>
  <text x="750" y="415" font-size="10" fill="#2f6fa3" text-anchor="middle">0.00%</text>

  <rect x="764" y="260" width="26" height="160" fill="#1e6b4b" rx="2" opacity="0.95"/>
  <text x="777" y="255" font-size="11" font-weight="bold" fill="#1e6b4b" text-anchor="middle">50.00%</text>

  <text x="750" y="445" font-size="12" font-weight="600" fill="#1a2521" text-anchor="middle">负例检索命中率</text>

  <!-- 显著性标识卡片 -->
  <rect x="520" y="70" width="320" height="40" fill="#eef7f2" stroke="#1e6b4b" rx="5"/>
  <text x="535" y="95" font-size="12" font-weight="bold" fill="#1e6b4b">Wilcoxon（三路融合 vs 纯关键词）: p = 0.2868，Holm 校正 0.8605（不显著）</text>

  <!-- 底部结论条 -->
  <rect x="40" y="465" width="820" height="25" fill="#f0f5f2" rx="4"/>
  <text x="50" y="482" font-size="12" fill="#2d5240">实证发现：同一语料同一中文嵌入下，纯关键词 MRR 0.4288 / 纯向量 0.2362 / 三路加权融合 0.4573；真实增量在 Recall@10（80.0% vs 72.5%），相对纯关键词的 MRR 差异不显著（Holm 0.860）。</text>
</svg>