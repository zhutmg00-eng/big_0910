# pytest 配置：把收集范围限定在 tests/，避免子目录里的副本污染收集。
#
# 历史问题：本仓库曾被放在 working tree 内做过 `git clone` 验证（tmp\cleansim），
# 子目录里带一套同名 tests/，根目录直接跑 pytest 会报
# "60 errors during collection"（源码副本重复、conftest 冲突）。
# 同理，output\ 交付打包目录里也含一份源码副本。
# 限定 testpaths 后这两类情况都不会再阻断测试。
#
# 用法不变：python -m pytest -q
#
# 标记：integration = 需要真实网络/凭证的测试（tests/test_llm_live.py）。
# 这些测试在没有凭证时自行 skip，因此 CI 无需特殊处理；要单独排除可加
# `-m "not integration"`。
[pytest]
testpaths = tests scripts/test_rag_pipeline.py
norecursedirs = .git .venv venv __pycache__ tmp output build dist node_modules .pytest_cache
markers =
    integration: 需要真实网络或 LLM 凭证，缺少时自动 skip
