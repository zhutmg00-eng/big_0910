name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest-cov
      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: data/models
          key: models-bge-small-zh-v1.5
      - name: Lint (ruff)
        # scripts/ 也纳入——此前只查 src tests，scripts 下积了 22 处告警
        # （13 F541 + 7 F401 + 2 F841）一直没人发现。
        run: |
          python -m pip install ruff
          ruff check src tests scripts
      - name: Ingest policy documents
        run: python scripts/ingest_policy_docs.py --force
      - name: Run tests
        env:
          RAG_BENCH_REQUIRED: "1"
        run: python -m pytest -q --cov=src --cov-report=term-missing:skip-covered
      - name: RAG benchmark regression
        run: python scripts/evaluate_rag_benchmark.py
