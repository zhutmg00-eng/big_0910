name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Ingest policy documents
        run: python scripts/ingest_policy_docs.py
      - name: Run tests
        run: python -m pytest -q
